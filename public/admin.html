<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin Antrean</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --ink: #172321;
            --muted: #71807d;
            --line: #e7eeeb;
            --accent: #176b58;
            --success: #16805f;
            --danger: #c64b4b;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: clamp(20px, 5vw, 56px) 16px;
            background: #f7f9f8;
            color: var(--ink);
            font-family: 'Space Grotesk', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 1040px;
            margin: 0 auto;
            padding: clamp(20px, 5vw, 36px);
            border: 1px solid var(--line);
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 18px 50px rgba(27, 55, 47, 0.07);
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--line);
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 600;
            letter-spacing: -0.06em;
            line-height: 1.2;
        }

        .intro {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .table-wrap {
            margin-top: 24px;
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: 14px;
        }

        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { padding: 14px 16px; border-bottom: 1px solid var(--line); }
        th {
            background: #f5f8f6;
            color: #52615c;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        td { color: #53625e; font-size: 0.88rem; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover { background: #fbfcfb; }
        td strong { color: var(--ink); }

        .status-diterima { color: var(--success); font-weight: 700; }
        .status-ditolak { color: var(--danger); font-weight: 700; }
        .status-pending { color: #a56b13; font-weight: 700; }

        .btn {
            min-height: 40px;
            padding: 9px 14px;
            border: 1px solid transparent;
            border-radius: 10px;
            font: inherit;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:focus-visible { outline: 3px solid rgba(23, 107, 88, 0.2); outline-offset: 2px; }
        .btn-reset { flex: 0 0 auto; background: #fff; border-color: #f0dada; color: var(--danger); }
        .btn-reset:hover, .btn-tolak:hover { border-color: var(--danger); background: #fff9f9; }
        .btn-terima { background: var(--success); color: #fff; }
        .btn-terima:hover { background: #125643; }
        .btn-tolak { margin-left: 6px; border-color: #f0dada; background: #fff; color: var(--danger); }

        @media (max-width: 620px) {
            .header-flex { align-items: flex-start; flex-direction: column; }
            .btn-reset { width: 100%; }
            th, td { padding: 12px 10px; white-space: nowrap; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-flex">
            <div>
                <p class="eyebrow">Layanan Penukaran Uang</p>
                <h1>Monitoring Antrean</h1>
                <p class="intro">Pantau dan verifikasi antrean secara real-time.</p>
            </div>
            <button class="btn btn-reset" onclick="resetAntrean()">Reset Semua Antrean</button>
        </div>

        <div class="table-wrap">
            <table id="adminTable">
                <thead>
                    <tr>
                        <th>Database ID</th>
                        <th>Nomor Urut</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function load() {
            try {
                const res = await fetch('/api/admin/list');
                const data = await res.json();
                const tbody = document.getElementById('tbody');
                tbody.innerHTML = '';

                data.forEach(d => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${d.id}</td>
                        <td><strong>${d.status !== 'ditolak' ? d.nomor_urut : '-'}</strong></td>
                        <td class="status-${d.status}">${d.status.toUpperCase()}</td>
                        <td>
                            ${d.status === 'pending' ? `
                                <button class="btn btn-terima" onclick="aksi(${d.id},'terima')">Terima</button>
                                <button class="btn btn-tolak" onclick="aksi(${d.id},'tolak')">Tolak</button>
                            ` : '-'}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error("Gagal memuat data");
            }
        }

        async function aksi(id, tipe) {
            await fetch('/api/verifikasi', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, aksi: tipe, kode: "2247" })
            });
            load();
        }

        // FUNGSI BARU: RESET
        async function resetAntrean() {
            const yakin = confirm("PERINGATAN!\n\nSemua data antrean di database akan DIHAPUS PERMANEN dan nomor urut akan kembali ke 1. Lanjutkan?");
            
            if (yakin) {
                const res = await fetch('/api/admin/reset', { method: 'POST' });
                const hasil = await res.json();
                alert(hasil.message);
                load();
            }
        }
        // Contoh fungsi di admin.html
        async function terimaAntrean(id) {
            const res = await fetch('/api/verifikasi', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, aksi: 'terima' }) // Tanpa mengirim 'kode'
            });
            if(res.ok) {
                loadData(); // Refresh tabel admin
            }
        }
        // Auto Refresh setiap 3 detik
        setInterval(load, 3000);
        load();
    </script>
</body>
</html>
